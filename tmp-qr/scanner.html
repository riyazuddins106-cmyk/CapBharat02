<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f0f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 40px 20px;
  }
  .container {
    display: flex;
    gap: 32px;
    align-items: stretch;
  }
  .card {
    background: #1a1a1a;
    border-radius: 20px;
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    border: 1px solid #2a2a2a;
    min-width: 320px;
  }
  .badge {
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .badge-customer { background: #5b3ef510; color: #a78bfa; border: 1px solid #5b3ef540; }
  .badge-partner  { background: #0ea5e910; color: #38bdf8; border: 1px solid #0ea5e940; }
  .title {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    text-align: center;
  }
  .subtitle {
    font-size: 13px;
    color: #666;
    text-align: center;
  }
  .qr-wrap {
    background: #fff;
    border-radius: 12px;
    padding: 12px;
  }
  .qr-wrap img { display: block; width: 240px; height: 240px; }
  .url {
    font-size: 11px;
    color: #444;
    word-break: break-all;
    text-align: center;
    font-family: monospace;
  }
  .hint {
    font-size: 12px;
    color: #555;
    text-align: center;
  }
  .hint span { color: #a78bfa; font-weight: 600; }
</style>
</head>
